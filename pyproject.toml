[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "purevision"
version = "1.0.0"
description = "PureVision LIDC baseline and dataset-driven construction, inference and evaluation tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "safetensors>=0.4",
  "tensorboard>=2.15",
  "torch>=2.4",
  "transformers>=4.51",
]

[project.optional-dependencies]
preprocess = [
  "pylidc>=0.2.3",
  "lungmask>=0.2",
  "SimpleITK>=2.3",
  "scikit-learn>=1.3",
  "scikit-image>=0.22",
  "scipy>=1.11",
]
construction = [
  "opencv-python-headless>=4.8",
  "pydicom>=2.4",
  "nibabel>=5.0",
  "scipy>=1.11",
]
test = ["pytest>=8.0"]
parser = ["openai>=2.0"]

[project.scripts]
purevision-train-phenotype = "purevision.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "-q"
